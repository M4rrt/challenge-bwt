# TEMPORARY: db/redis host ports are 5545/6381 instead of the standard
# 5544/6380, because orphaned root-owned docker-proxy processes (PIDs
# 167318/167324/167346/167352, running since before this change) are still
# holding 5544/6380 on the host with no live container behind them. Revert
# to "5544:5432" / "6380:6379" once those are killed
# (`sudo kill -9 167318 167324 167346 167352` or `sudo systemctl restart
# docker`) — and update backend/.env(.example) DATABASE_URL/REDIS_URL back
# to match if they were changed for local (non-Docker) runs in the meantime,
# specifically backend/.env.example's DATABASE_URL/REDIS_URL.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      - "5545:5432"
    volumes:
      - chat_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WEBHOOK_TEST_SECRET: change-me
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  backend:
    build:
      context: ./backend
      target: builder
    command: sh -c "uv run --no-sync alembic upgrade head && uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+asyncpg://chat:chat@db:5432/chat
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: change-me
      WEBHOOK_HMAC_SECRET: change-me
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  chat_db_data:
  frontend_node_modules:
