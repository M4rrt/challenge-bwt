name: challenge-bwt

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://chat:chat@db:5432/chat
  REDIS_URL: redis://redis:6379/0
  # Two keys: the fixture pair tests/chat_tokens.py signs with, and the
  # monolith's real local-dev public key (kid bwt-chat-dev-1, published at
  # http://localhost:8000/.well-known/chat-jwks.json) — needed to verify
  # tokens minted by a locally running br-wine-tours-backend.
  CHAT_TOKEN_JWKS: '{"keys": [{"alg": "RS256", "kty": "RSA", "n": "065cm5vw-A5Qg8bvn1aJeb9jRP19OUDNtJP_-b3l3e2I36TMkCS6I8Xiv_SgkX2q4xcac_9--jy6ya3KjHHaaDXMuTCTcCpyRUa9j8UyrfuWlwYUIesqfD6L8yjY6oxSwZqtDgZ3R8wc35661UMXWGyNpA_SPi-V6JXOU_TnLoAJPxurnGKBCBG0SSNd_-u1Ofh-vvllIxvvlYRLk2zAzDAGZk2ziJ6o4EKgmriTEdjS2H1Y6qfmZgMs7u8A4J3omvMDQ7YbEjF0qLuDkHBMtrRdpVVtu-i7Qe2XXXyaVoVxqGA-JgjHbk3JrESw_p4O8RIlavGEc7CV8-CJPQnGQw", "e": "AQAB", "kid": "test-chat-key-1", "use": "sig"}, {"kty": "RSA", "key_ops": ["verify"], "n": "zcU2yyKgeypt7JrD2Th1_f4HRYcvNTb-VDjv1V5BlvwrQ1YRVe_hD3AZDLAWD9Gm8tigTXdIrrEPTRtUqGqlHssnITu5HuSLp4rqG-CzTcuvOew1CaiYIZf6dK4eT1eF_ut1JgM8qlb3VTKnsAdTmLUwKj_D1uJ1FAULyGV1nXEFX6vgklPRU5GIq0ZrdkZNndk-YASr8_ZObf75x_u0wtYx2GgKZZ1jvOiEAQjN31vUB54HEBAFNpaMc2JDitj08zrH0gl2T-JU6rZFlirF-j0N9awMI3-XSyTFgvRKVFvwCSfnA-ArbiFGoMmLbZYyTNrDjqhOJeNxPWRdTEfNaQ", "e": "AQAB", "kid": "bwt-chat-dev-1", "alg": "RS256", "use": "sig"}]}'
  CHAT_TOKEN_AUDIENCE: bwt-chat
  WEBHOOK_HMAC_SECRET: change-me
  INTERNAL_SERVICE_TOKEN: change-me
  PYTHONDONTWRITEBYTECODE: 1

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      - "5544:5432"
    volumes:
      - chat_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  drain:
    build:
      context: ./backend
      target: builder
    command: uv run --no-sync python -m app.drain
    environment: *backend-env
    restart: unless-stopped
    volumes:
      - ./backend/app:/app/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Not a code dependency — `backend` is what runs `alembic upgrade head`,
      # and starting before the outbox table exists just means a minute of
      # logged, retried ticks.
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:8001
      VITE_WEBHOOK_TEST_SECRET: change-me
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  backend:
    build:
      context: ./backend
      target: builder
    command: sh -c "uv run --no-sync alembic upgrade head && uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload"
    environment:
      <<: *backend-env
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8001:8001"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  chat_db_data:
  frontend_node_modules:
